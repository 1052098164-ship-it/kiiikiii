<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KiiiKiii World</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=VT323&family=Zen+Maru+Gothic:wght@500;700&display=swap');

    :root {
      --mint-main: #a8e6cf;
      --mint-glass: rgba(168, 230, 207, 0.45);
      --blue-glass: rgba(179, 226, 253, 0.45);
      --mint-border: rgba(99, 207, 168, 0.7);
      --text-dark: #2a3e35;
      --card-glass: rgba(255, 255, 255, 0.85);
      --lace-blue: #bfe3f2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Zen Maru Gothic', -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text-dark);
      background-color: #e8f8f5;
      position: relative;
    }

    /* 全局下雨般飘落的可爱挂件容器 */
    .rain-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }
    .rain-item {
      position: absolute;
      top: -50px;
      font-size: 24px;
      opacity: 0.85;
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.9));
      animation: fallRain linear infinite;
    }

    @keyframes fallRain {
      0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
      10% { opacity: 0.9; }
      90% { opacity: 0.9; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    /* 页面切换控制 */
    .page-view {
      position: absolute;
      top: 0; left: 0; width: 100%; min-height: 100vh;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease-in-out;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .page-view.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
    }

    .interactive-element {
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      user-select: none;
    }
    .interactive-element:active { transform: scale(0.94) !important; }

    /* Y2K 顶部公共导航与音乐播放器 */
    .y2k-phone-header {
      position: relative; z-index: 100; width: 100%; max-width: 950px;
      background: rgba(130, 215, 185, 0.75); backdrop-filter: blur(12px);
      border-radius: 0 0 20px 20px; padding: 10px 20px; color: white;
      border: 1px solid rgba(255, 255, 255, 0.6); border-top: none;
      font-family: 'VT323', monospace;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(168, 230, 207, 0.4);
    }
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 16px; border-bottom: 1px dashed rgba(255, 255, 255, 0.6);
      padding-bottom: 4px; margin-bottom: 8px;
    }
    .nav-links span {
      margin-right: 12px; cursor: pointer; text-decoration: underline;
    }
    .music-player {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255, 255, 255, 0.35); padding: 4px 12px;
      border-radius: 20px; font-size: 13px;
    }
    .music-btn {
      background: white; color: var(--text-dark); border: none;
      padding: 2px 8px; border-radius: 12px; font-weight: bold; font-size: 12px;
    }

    /* 简化的小巧导入按钮 */
    .compact-upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid var(--mint-border);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      color: #2c5846;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 12px;
      z-index: 30;
    }

    /* ================= PAGE 1: 首页 ================= */
    #page1 {
      justify-content: center;
      background: 
        linear-gradient(rgba(232, 248, 245, 0.2), rgba(232, 248, 245, 0.2)),
        url('image_8.png') center/cover no-repeat,
        url('image_7.png') center/cover no-repeat;
      background-blend-mode: overlay, screen, normal;
      position: relative;
      overflow: hidden;
    }

    .hero-container {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      flex-direction: column;
    }

    .art-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(60px, 12vw, 150px);
      width: 70vw;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, #b3e2fd 40%, #5cbbf0 70%, #2072b2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9))
              drop-shadow(3px 3px 0px #31729b)
              drop-shadow(-2px -2px 0px #ffffff);
      z-index: 5;
      animation: breathe 3.5s ease-in-out infinite alternate;
      line-height: 1;
    }

    @keyframes breathe {
      0% { transform: scale(0.97); }
      100% { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(168,230,207,0.9)) drop-shadow(0 0 15px rgba(255,255,255,1)); }
    }

    .page1-enter-btn {
      position: absolute; bottom: 80px; z-index: 10;
      padding: 12px 36px;
      background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
      border: 2px solid var(--mint-border); border-radius: 30px;
      font-weight: bold; letter-spacing: 2px; color: var(--text-dark);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* ================= PAGE 2: KiiiKiii’s Story ================= */
    #page2 {
      background: linear-gradient(135deg, #e8f8f5 0%, #ccefe3 100%);
      padding-bottom: 40px;
    }

    /* 蕾丝丰富边框 */
    .lace-wrapper-p2 {
      position: relative;
      width: 92%; max-width: 960px;
      z-index: 10; padding: 20px;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 28px;
      border: 8px dashed var(--lace-blue);
      outline: 5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 0 12px rgba(168, 230, 207, 0.4), 0 12px 35px rgba(0,0,0,0.08);
    }

    .polaroid-layout {
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: center;
    }

    /* 分栏：照片占比更大（55%），诗句面板占比略小（42%） */
    .polaroid-left-large {
      flex: 0 0 55%;
      display: flex;
      justify-content: center;
    }
    .polaroid-frame-large {
      background: white;
      padding: 18px 18px 50px 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      border-radius: 8px;
      width: 100%; max-width: 440px;
      transform: rotate(-1deg);
      transition: transform 0.3s;
    }
    .polaroid-frame-large:hover { transform: rotate(0deg) scale(1.01); }

    .polaroid-img-box {
      width: 100%;
      height: 380px;
      background-size: cover;
      background-position: center;
      background-color: #f8f8f8;
      border-radius: 4px;
      border: 1px solid #eaeaea;
      transition: background-image 0.3s ease-in-out;
    }

    /* 诗句透明面板 + 泡泡装饰 */
    .poetry-panel-glass {
      flex: 0 0 42%;
      position: relative;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      padding: 22px;
      box-shadow: 0 8px 20px rgba(168, 230, 207, 0.25);
      overflow: hidden;
    }

    /* 诗句面板上的动态泡泡 */
    .panel-bubble {
      position: absolute;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(179, 226, 253, 0.4));
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.8);
      pointer-events: none;
      animation: floatBubble 4s ease-in-out infinite alternate;
    }
    .b1 { width: 45px; height: 45px; top: 10px; right: 15px; animation-delay: 0s; }
    .b2 { width: 30px; height: 30px; bottom: 15px; right: 30px; animation-delay: 1.5s; }
    .b3 { width: 25px; height: 25px; top: 40%; left: -10px; animation-delay: 0.8s; }

    @keyframes floatBubble {
      0% { transform: translateY(0px) scale(0.95); }
      100% { transform: translateY(-12px) scale(1.05); }
    }

    .poetry-text {
      font-family: 'Zen Maru Gothic', sans-serif;
      color: #244235;
      line-height: 1.8;
      font-size: 14px;
      font-weight: 500;
      position: relative;
      z-index: 2;
    }
    .poetry-section { margin-bottom: 12px; }

    /* ================= PAGE 3: Whykiiikiii ================= */
    #page3 {
      background: linear-gradient(135deg, #d8f3ec 0%, #c5eef8 100%);
      padding-bottom: 40px;
    }

    /* 4个半透明软萌按钮 */
    .soft-buttons-bar {
      position: relative; z-index: 10;
      display: flex; gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap; justify-content: center;
    }
    .soft-btn {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(168, 230, 207, 0.8);
      padding: 8px 18px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: bold;
      color: #225240;
      box-shadow: 0 4px 12px rgba(168, 230, 207, 0.3);
      transition: all 0.2s ease;
    }
    .soft-btn.active, .soft-btn:hover {
      background: rgba(168, 230, 207, 0.9);
      color: white;
      border-color: white;
      transform: translateY(-2px);
    }

    /* Page 3 梦幻丰富边框 */
    .p3-dream-wrapper {
      position: relative; z-index: 10;
      width: 90%; max-width: 850px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(16px);
      border-radius: 30px; padding: 25px;
      border: 6px solid var(--lace-blue);
      outline: 4px dashed rgba(168, 230, 207, 0.8);
      box-shadow: 0 10px 30px rgba(147, 213, 230, 0.3);
      display: flex; flex-direction: column; align-items: center;
    }

    /* 尺寸不固定，根据上传图片自由适应 */
    .p3-adaptive-frame {
      max-width: 100%;
      display: flex; justify-content: center; align-items: center;
      background: rgba(255,255,255,0.9); padding: 12px; border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .p3-img {
      max-width: 100%; max-height: 60vh;
      width: auto; height: auto;
      object-fit: contain;
      border-radius: 10px;
      transition: opacity 0.4s ease-in-out;
    }

    @media (max-width: 768px) {
      .polaroid-layout { flex-direction: column; }
      .polaroid-left-large, .poetry-panel-glass { flex: 0 0 100%; width: 100%; }
    }
  </style>
</head>
<body>

  <!-- 全局像下雨一样飘落的可爱挂件 -->
  <div class="rain-container" id="rainBox"></div>

  <!-- 全局背景音乐 -->
  <audio id="bgmAudio" loop></audio>

  <!-- ================= PAGE 1: 首页 ================= -->
  <div id="page1" class="page-view active">
    <div class="hero-container">
      <h1 class="art-title interactive-element" onclick="navigateTo('page2')">KiiiKiii</h1>
    </div>
    <button class="page1-enter-btn interactive-element" onclick="navigateTo('page2')">ENTER COLLECTION ✦</button>
  </div>

  <!-- ================= PAGE 2: KiiiKiii’s Story ================= -->
  <div id="page2" class="page-view">
    <div class="y2k-phone-header">
      <div class="status-bar">
        <div class="nav-links">
          <span onclick="navigateTo('page1')">1. 首页</span>
          <strong>2. KiiiKiii’s Story</strong>
          <span onclick="navigateTo('page3')">3. Whykiiikiii</span>
        </div>
        <div class="music-player">
          <span>🎵 <span id="bgmName1">未选择音频</span></span>
          <button class="music-btn interactive-element" onclick="toggleBGM()">▶/⏸</button>
          <label class="music-btn interactive-element">📂<input type="file" class="audio-input" accept="audio/*" style="display:none;"></label>
        </div>
      </div>
    </div>

    <!-- 简化的小巧导入按钮 -->
    <label class="compact-upload-btn interactive-element">
      📷 导入照片
      <input type="file" id="p2Input" multiple accept="image/*" style="display:none;">
    </label>

    <!-- 蕾丝边框与分栏结构 -->
    <div class="lace-wrapper-p2">
      <div class="polaroid-layout">
        <!-- 左侧照片占比更大（55%），1秒轮播间隔 -->
        <div class="polaroid-left-large">
          <div class="polaroid-frame-large">
            <div class="polaroid-img-box" id="p2PhotoBox"></div>
            <div style="margin-top: 12px; font-family: 'VT323', monospace; font-size: 20px; color: #777; text-align: center;" id="p2Caption">KiiiKiii Memory #1</div>
          </div>
        </div>

        <!-- 右侧透明诗句面板（42%），配有动态泡泡 -->
        <div class="poetry-panel-glass">
          <div class="panel-bubble b1"></div>
          <div class="panel-bubble b2"></div>
          <div class="panel-bubble b3"></div>
          
          <div class="poetry-text">
            <div class="poetry-section">
              <p>要是问你喜不喜欢夏天</p>
              <p>你会嘟囔着说我会喜欢吗</p>
              <p>我就静静地望着这样的你</p>
            </div>
            <div class="poetry-section">
              <p>即便在这闷热难熬的季节里</p>
              <p>你依旧如此耀眼美丽</p>
              <p>这件事本身就令人难以置信</p>
            </div>
            <div class="poetry-section">
              <p>人们匆匆朝着家的方向赶路</p>
              <p>云层透着异样的沉闷</p>
              <p>看样子大雨即将倾盆而下</p>
            </div>
            <div class="poetry-section">
              <p>可为何我们不愿安静待在屋檐下</p>
              <p>为何无法忍受这一天悄然落幕</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= PAGE 3: Whykiiikiii ================= -->
  <div id="page3" class="page-view">
    <div class="y2k-phone-header">
      <div class="status-bar">
        <div class="nav-links">
          <span onclick="navigateTo('page1')">1. 首页</span>
          <span onclick="navigateTo('page2')">2. KiiiKiii’s Story</span>
          <strong>3. Whykiiikiii</strong>
        </div>
        <div class="music-player">
          <span>🎵 <span id="bgmName2">未选择音频</span></span>
          <button class="music-btn interactive-element" onclick="toggleBGM()">▶/⏸</button>
          <label class="music-btn interactive-element">📂<input type="file" class="audio-input" accept="audio/*" style="display:none;"></label>
        </div>
      </div>
    </div>

    <!-- 横向 4 个半透明软萌按钮 -->
    <div class="soft-buttons-bar">
      <button class="soft-btn interactive-element active" onclick="switchTab(this)">1. sweet sour</button>
      <button class="soft-btn interactive-element" onclick="switchTab(this)">2. blue hour</button>
      <button class="soft-btn interactive-element" onclick="switchTab(this)">3. eve2late</button>
      <button class="soft-btn interactive-element" onclick="switchTab(this)">4. pop off pop off</button>
    </div>

    <!-- 简化导入按钮 -->
    <label class="compact-upload-btn interactive-element">
      📷 导入照片
      <input type="file" id="p3Input" multiple accept="image/*" style="display:none;">
    </label>

    <!-- 梦幻丰富的照片展示区（自由适应尺寸，2秒轮播间隔） -->
    <div class="p3-dream-wrapper">
      <div class="p3-adaptive-frame">
        <img id="p3Image" class="p3-img" src="image_7.png" alt="Whykiiikiii 照片">
      </div>
      <div style="margin-top: 14px; font-weight: bold; color: #21503e; font-size: 14px;" id="p3CountLabel">Whykiiikiii Memory #1</div>
    </div>
  </div>

  <script>
    // --- 生成下雨般飘落的可爱图标挂件 ---
    const rainIcons = ['🧚‍♀️', '🍀', '🎵', '🕊️', '💧', '✦', '🫧', '✨', '🌸'];
    const rainBox = document.getElementById('rainBox');

    for (let i = 0; i < 22; i++) {
      const item = document.createElement('div');
      item.className = 'rain-item';
      item.innerText = rainIcons[Math.floor(Math.random() * rainIcons.length)];
      item.style.left = Math.random() * 100 + 'vw';
      item.style.animationDuration = (4 + Math.random() * 5) + 's';
      item.style.animationDelay = (Math.random() * 5) + 's';
      item.style.fontSize = (18 + Math.random() * 16) + 'px';
      rainBox.appendChild(item);
    }

    // 页面跳转
    function navigateTo(pageId) {
      playClickSound();
      document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    // 点击音效
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    document.addEventListener('click', e => {
      if (e.target.closest('.interactive-element')) playClickSound();
    });

    // --- PAGE 2 拍立得轮播（1秒间隔） ---
    let p2Photos = ['image_7.png', 'image_8.png'];
    let p2Index = 0;
    const p2PhotoBox = document.getElementById('p2PhotoBox');
    const p2Caption = document.getElementById('p2Caption');

    function updateP2Display() {
      if (p2Photos.length > 0) {
        p2PhotoBox.style.backgroundImage = `url('${p2Photos[p2Index]}')`;
        p2Caption.innerText = `KiiiKiii Memory #${p2Index + 1}`;
      }
    }
    updateP2Display();

    // 1秒滑动间隔
    setInterval(() => {
      if (p2Photos.length > 0) {
        p2Index = (p2Index + 1) % p2Photos.length;
        updateP2Display();
      }
    }, 1000);

    document.getElementById('p2Input').addEventListener('change', function(e) {
      const files = e.target.files;
      if (files.length > 0) {
        p2Photos = Array.from(files).map(f => URL.createObjectURL(f));
        p2Index = 0;
        updateP2Display();
      }
    });

    // --- PAGE 3 Whykiiikiii 轮播（2秒间隔，自由适应尺寸） ---
    let p3Photos = ['image_7.png', 'image_8.png'];
    let p3Index = 0;
    const p3Image = document.getElementById('p3Image');
    const p3CountLabel = document.getElementById('p3CountLabel');

    function updateP3Display() {
      if (p3Photos.length > 0) {
        p3Image.style.opacity = 0.2;
        setTimeout(() => {
          p3Image.src = p3Photos[p3Index];
          p3Image.style.opacity = 1;
          p3CountLabel.innerText = `Whykiiikiii Memory #${p3Index + 1}`;
        }, 150);
      }
    }
    updateP3Display();

    // 2秒滑动间隔
    setInterval(() => {
      if (p3Photos.length > 0) {
        p3Index = (p3Index + 1) % p3Photos.length;
        updateP3Display();
      }
    }, 2000);

    document.getElementById('p3Input').addEventListener('change', function(e) {
      const files = e.target.files;
      if (files.length > 0) {
        p3Photos = Array.from(files).map(f => URL.createObjectURL(f));
        p3Index = 0;
        updateP3Display();
      }
    });

    // 软萌分类按钮切换
    function switchTab(btn) {
      document.querySelectorAll('.soft-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // 音频管理
    const audio = document.getElementById('bgmAudio');
    document.querySelectorAll('.audio-input').forEach(input => {
      input.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          audio.src = URL.createObjectURL(file);
          const name = file.name.replace(/\.[^/.]+$/, "");
          document.getElementById('bgmName1').innerText = name;
          document.getElementById('bgmName2').innerText = name;
          audio.play();
        }
      });
    });

    function toggleBGM() {
      if (!audio.src) {
        alert('请先点击 📂 选择本地 MP3 音频导入！');
        return;
      }
      if (audio.paused) audio.play();
      else audio.pause();
    }
  </script>
</body>
</html>
